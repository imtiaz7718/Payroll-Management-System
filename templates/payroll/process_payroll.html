{% extends 'base.html' %}

{% block content %}
<div class="mb-4">
    <h1 class="page-title">
        <i class="fas fa-cogs"></i> Process Payroll
    </h1>
</div>

<div class="row">
    <div class="col-lg-6 mx-auto">
        <div class="glass">
            <form method="post">
                {% csrf_token %}
                
                <div class="alert alert-info mb-4">
                    <i class="fas fa-info-circle"></i> This will process payroll for all active employees based on their attendance records.
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Month *</label>
                    <input type="number" name="month" class="form-control" min="1" max="12" value="{{ current_month }}" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Year *</label>
                    <input type="number" name="year" class="form-control" value="{{ current_year }}" required>
                </div>
                
                <div class="alert alert-warning mb-4">
                    <strong>⚠️ Note:</strong> Make sure all attendance records and salary structures are updated before processing payroll.
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <button type="submit" class="btn btn-success btn-lg w-100">
                            <i class="fas fa-play"></i> Process Payroll
                        </button>
                    </div>
                    <div class="col-md-6">
                        <a href="/payroll/" class="btn btn-secondary btn-lg w-100">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
