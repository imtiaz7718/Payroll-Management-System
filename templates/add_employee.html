{% extends 'base.html' %}
{% block content %}

<div class="glass col-md-6">

<h4>Add Employee</h4>

<form method="post">
{% csrf_token %}

<input name="name" placeholder="Name" class="form-control mb-2">
<select name="position" class="form-control mb-2">
<option>Junior</option>
<option>Senior</option>
<option>Manager</option>
</select>
<input name="experience" placeholder="Experience" class="form-control mb-2">
<input name="salary" placeholder="Salary" class="form-control mb-2">

<button class="btn btn-light">Save</button>

</form>

</div>

{% endblock %}
