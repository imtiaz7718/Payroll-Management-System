{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto">
        <div class="glass text-center" style="background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%); color: white;">
            <h2 class="mb-3"><i class="fas fa-exclamation-triangle"></i> Confirm Action</h2>
            <p class="mb-4">Are you sure you want to delete the employee <strong>{{ employee.name }}</strong>?</p>
            <p class="mb-4">This action will mark the employee as inactive.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-light btn-lg" style="color: #f45c43;">
                        <i class="fas fa-check"></i> Yes, Delete Employee
                    </button>
                    <a href="/employees/{{ employee.id }}/" class="btn btn-outline-light btn-lg">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
